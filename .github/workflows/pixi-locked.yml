name: Pixi Locked Environments

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dependency-definitions:
    name: dependency definitions sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checker dependency
        run: python -m pip install packaging
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: true
      - name: Check dependency definitions are synchronized
        run: bash tools/sync_dependency_definitions.sh --check

  test:
    name: pixi test (locked)
    runs-on: ubuntu-latest
    needs: dependency-definitions
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: true
          environments: test
      - name: Install locked test environment
        run: pixi install --locked -e test
      - name: Run unit test task
        run: pixi run -e test test-unit
      - name: Run installed package test task
        run: pixi run -e test test-installed

  docs:
    name: pixi docs (locked)
    runs-on: ubuntu-latest
    needs: dependency-definitions
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: true
          environments: docs
      - name: Install locked docs environment
        run: pixi install --locked -e docs
      - name: Build docs task
        run: pixi run -e docs docs-build

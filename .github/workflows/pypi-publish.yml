name: Publish to PyPI

on:
  release:
    types:
      - published

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release tag matches project version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import tomllib

          project_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          release_tag = os.environ["RELEASE_TAG"].removeprefix("v")

          if release_tag != project_version:
              raise SystemExit(
                  f"Release tag {release_tag!r} does not match pyproject version {project_version!r}."
              )
          print(f"Validated release tag {release_tag} matches project version.")
          PY

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: publish to pypi
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/cryoswath
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1


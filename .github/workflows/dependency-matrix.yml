name: Dependency Matrix

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  compatibility:
    name: "${{ matrix.name }} (py${{ matrix.python }}, ${{ matrix.xarray_spec }})"
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: min-supported
            python: "3.12"
            xarray_spec: "xarray==2026.3.*"
            experimental: false
          - name: latest-supported
            python: "3.13"
            xarray_spec: "xarray"
            experimental: false
          - name: py314-observe
            python: "3.14"
            xarray_spec: "xarray"
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pytest "${{ matrix.xarray_spec }}" --editable .
          python -m pip check

      - name: Smoke test imports
        run: |
          python - <<'PY'
          import platform
          import xarray as xr
          import cryoswath
          from cryoswath import l1b
          print("python:", platform.python_version())
          print("xarray:", xr.__version__)
          print("cryoswath:", cryoswath.__version__)
          print("l1b module:", l1b.__name__)
          PY

      - name: Run unit tests
        run: python -m pytest -q tests/test_*

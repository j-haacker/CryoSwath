[workspace]
name = "cryoswath"
description = "CryoSwath environment using pixi"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
conda-pypi-map = { conda-forge = "conda-pypi-map.json", bioconda = "conda-pypi-map.json" }

[dependencies]
python = "3.12.*"
bottleneck = "*"
dask = "*"
defusedxml = "*"
earthaccess = ">=0.18"
geopandas = ">=1.0.1"
h5netcdf = "*"
h5py = "*"
keyring = "*"
matplotlib = "*"
numpy = "*"
packaging = "*"
pandas = ">=2,<3"
pyarrow = "*"
pyogrio = "*"
pyproj = "*"
pystac-client = "*"
python-dateutil = "*"
rasterio = "*"
rioxarray = "*"
scikit-learn = "*"
scipy = "*"
shapely = "*"
stackstac = "*"
statsmodels = "*"
pytables = "*"
tqdm = "*"
xarray = ">=2026.3"
zarr = "*"

[feature.runtime.pypi-dependencies]
# Keep local source editable, but resolve the runtime stack via Conda below.
cryoswath = { path = ".", editable = true }

[feature.test]
channels = ["conda-forge", "bioconda", "nodefaults"]

[feature.test.dependencies]
# Keep this list limited to test-only additions. The test environment already
# inherits top-level [dependencies], and Pixi's conda export preserves repeated
# package entries if a package is declared in both places.
python-build = "*"
distributed = "*"
ipykernel = "*"
nbconvert = "*"
papermill = "*"
pre-commit = "*"
snakemake = "*"
pytest = "*"
ruff = "*"
twine = "*"

[feature.docs]
channels = ["conda-forge", "nodefaults"]

[feature.docs.dependencies]
sphinx = "*"
pydata-sphinx-theme = "*"

[feature.lab.dependencies]
ipykernel = "*"

[feature.lab.pypi-dependencies]
snippets = { git = "https://github.com/j-haacker/snipGit.git", branch = "main" }

[feature.ci]
channels = ["conda-forge", "nodefaults"]

[feature.ci.dependencies]
act = "*"

[feature.docs.tasks]
docs-build = "python -m sphinx -b html docs docs/_build/html"
docs-build-strict = "python -m sphinx -W -b html docs docs/_build/html"

[feature.ci.tasks]
local-ci-pixi-test = "act -P ubuntu-latest=ghcr.io/catthehacker/ubuntu:act-latest -W .github/workflows/pixi-locked.yml -j test"
local-ci-docs = "act -P ubuntu-latest=ghcr.io/catthehacker/ubuntu:act-latest -W .github/workflows/pixi-locked.yml -j docs"
local-ci-dependency-matrix = "act -P ubuntu-latest=ghcr.io/catthehacker/ubuntu:act-latest -W .github/workflows/dependency-matrix.yml -j compatibility"

[feature.docker.tasks.docker-build]
args = [{ arg = "tag", default = "cryoswath/jupyterlab:nightly" }]
cmd = "docker build --network=host --pull -f docker/Dockerfile -t {{ tag }} ."

[feature.docker.tasks.docker-push]
args = [{ arg = "tag", default = "cryoswath/jupyterlab:nightly" }]
cmd = "docker push {{ tag }}"

[feature.docker.tasks.docker-update]
args = [{ arg = "tag", default = "cryoswath/jupyterlab:nightly" }]
depends-on = [
  { task = "docker-build", args = ["{{ tag }}"] },
  { task = "docker-push", args = ["{{ tag }}"] },
]

[feature.test.tasks]
lint = "ruff check ."
format-check = "ruff format --check ."
pre-commit-validate = "pre-commit validate-config"
package-check = "python tools/test_installed_wheel.py --package-check-only"
test-installed = "python tools/test_installed_wheel.py"
test-unit = "pytest -q tests/test_*"
test-fresh = "python tools/test_fresh_environment.py --source worktree --task test-all"
test-fresh-unit = "python tools/test_fresh_environment.py --source worktree --task test-unit"
test-fresh-committed = "python tools/test_fresh_environment.py --source committed --task test-all"
export-conda-for-notebooks = "bash \"$PIXI_PROJECT_ROOT/tests/reports/export_conda_env_from_pixi.sh\""
prepare-notebook-tests = "python tools/prepare_notebook_tests.py"
prepare-report-notebooks = "python tools/prepare_notebook_tests.py reports"
prepare-tutorial-notebooks = "python tools/prepare_notebook_tests.py tutorials"

[feature.test.tasks.test-notebooks]
depends-on = ["export-conda-for-notebooks", "prepare-report-notebooks"]
cmd = "env -u CRYOSWATH_DATA -u CRYOSWATH_L1B -u CRYOSWATH_L2_SWATH -u CRYOSWATH_L2_POCA -u CRYOSWATH_L3 -u CRYOSWATH_L4 -u CRYOSWATH_TMP -u CRYOSWATH_AUX -u CRYOSWATH_DEM -u CRYOSWATH_RGI -u CRYOSWATH_CS_GROUND_TRACKS snakemake --snakefile Snakefile --cores 4 --use-conda"
cwd = "tests/reports"
env = { PYTHONPATH = "$PIXI_PROJECT_ROOT", CRYOSWATH_CONFIG = "$PIXI_PROJECT_ROOT/tests/reports/artifacts/project/cryoswath.cfg" }

[feature.test.tasks.test-tutorial-notebooks]
args = [{ arg = "tutorial_dir", default = "$PIXI_PROJECT_ROOT/tests/tutorials/artifacts/project/tutorials" }]
depends-on = ["export-conda-for-notebooks", "prepare-tutorial-notebooks"]
cmd = "env -u CRYOSWATH_DATA -u CRYOSWATH_L1B -u CRYOSWATH_L2_SWATH -u CRYOSWATH_L2_POCA -u CRYOSWATH_L3 -u CRYOSWATH_L4 -u CRYOSWATH_TMP -u CRYOSWATH_AUX -u CRYOSWATH_DEM -u CRYOSWATH_RGI -u CRYOSWATH_CS_GROUND_TRACKS snakemake --directory \"{{ tutorial_dir }}\" --snakefile \"$PIXI_PROJECT_ROOT/tests/tutorials/Snakefile\" --cores 4 --use-conda"
env = { PYTHONPATH = "$PIXI_PROJECT_ROOT", CRYOSWATH_CONFIG = "$PIXI_PROJECT_ROOT/tests/tutorials/artifacts/project/cryoswath.cfg" }

[feature.test.tasks.test-all]
args = [{ arg = "tutorial_dir", default = "$PIXI_PROJECT_ROOT/tests/tutorials/artifacts/project/tutorials" }]
depends-on = [
  "test-unit",
  "test-installed",
  "test-notebooks",
  { task = "test-tutorial-notebooks", args = ["{{ tutorial_dir }}"] },
]

[environments]
default = { features = ["runtime"], solve-group = "runtime" }
test = { features = ["runtime", "test"], solve-group = "runtime" }
docs = { features = ["runtime", "docs"], solve-group = "docs" }
lab = { features = ["runtime", "lab"], solve-group = "runtime" }
ci = { features = ["ci"], no-default-feature = true }
docker = { features = ["docker"], no-default-feature = true }
